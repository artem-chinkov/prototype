pts+=done?point(585,53,'🪄','Развилка','done','choice','◆')+point(390,18,'🌲','Лесной ручей',state.selected==='forest'?'current':'locked','branch-forest',state.selected==='forest'?'★':'?')+point(280,61,'🏡','Домик в горах',state.selected==='mountain'?'current':'locked','branch-mountain',state.selected==='mountain'?'★':'?')+point(458,85,'🌴','Оазис',state.selected==='oasis'?'current':'locked','branch-oasis',state.selected==='oasis'?'★':'?'):point(288,55,'🏰','Скоро новая зона','locked','locked','🔒');
var hud='<div class="map-hud"><div class="row"><button class="iconbtn" data-action="home" aria-label="На главную">←</button><div class="pill" style="font-size:13px">🧒 Алекс</div>'+counter()+'</div><div class="hud-card"><div class="muted">МОЁ ПРИКЛЮЧЕНИЕ · SHOPPING</div><h3>'+(done?'Волшебный магазин пройден!':'Научись покупать продукты')+'</h3><div class="bar"><i style="width:'+(done?100:67)+'%"></i></div><div class="tiny" style="margin-top:5px">'+(done?'3 из 3 миссий':'2 из 3 миссий')+'</div></div></div>';
var cta=done?(state.selected?'▶ Начать новую миссию':'🧭 Выбрать новый путь'):'▶ Начать миссию';var action=done?(state.selected?'next':'choice'):'mission';

function shopSet(){return '<div class="shop-set"><div class="awning"></div><div class="lantern">🏮</div><div class="shelf first"></div><div class="shelf second"></div><div class="counter-wood"></div></div>'+panda()}

var branches={forest:{title:'Лесной ручей',emoji:'🌲',desc:'Помоги белочке устроить пикник. Попроси ягоды!',cls:'forest'},mountain:{title:'Домик в горах',emoji:'🏡',desc:'Загляни к медвежонку. Попроси тёплый чай!',cls:'mountain'},oasis:{title:'Оазис путешественников',emoji:'🌴',desc:'Найди волшебное кафе и попроси прохладную воду!',cls:'oasis'}};
function choose(){var cards='';Object.keys(branches).forEach(function(k){var b=branches[k];cards+='<button class="choice-card '+(state.pending===k?'active':'')+'" data-action="pick-'+k+'" aria-pressed="'+(state.pending===k)+'"><div class="place-art '+b.cls+'">'+b.emoji+'</div><div style="flex:1"><h3>'+b.title+'</h3><p>'+b.desc+'</p></div><span class="choice-radio">'+(state.pending===k?'✓':'')+'</span></button>'});return '<section class="screen choice"><div class="screen-scroll"><div class="choice-head"><button class="iconbtn" data-action="results" style="position:absolute;top:calc(17px + env(safe-area-inset-top));left:18px">←</button><span class="pill" style="position:absolute;right:18px;top:calc(17px + env(safe-area-inset-top))">⭐ '+state.stars+'</span><div style="height:12px"></div>'+panda().replace('class="panda"','class="pandy-inline"')+'<h1>Куда отправимся?</h1><p>Выбери приключение, которое нравится тебе!</p></div><div class="cards">'+cards+'</div><div class="choice-footer"><button class="btn purple" data-action="confirm" '+(!state.pending?'disabled':'')+'>Выбрать этот путь →</button><p class="tiny" style="text-align:center;margin-top:10px">Все три пути помогают практиковать английский</p></div></div></section>'}
function pause(){return '<div class="overlay-pause"><div class="pause-card"><div style="font-size:60px">⏸️</div><h2>Перерыв!</h2><p>Отдохни немного. Pandy подождёт тебя в магазине.</p><button class="btn purple" data-action="resume">Продолжить ▶</button><button class="btn ghost" data-action="map">На карту</button></div></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){var html=state.screen==='home'?home():state.screen==='map'?mapScreen(false):state.screen==='mission'?mapScreen(true):state.screen==='intro'?intro():state.screen==='lesson'?lesson():state.screen==='results'?results():state.screen==='choose'?choose():home();app.innerHTML=html+(state.pause?pause():'');if(state.screen==='map'||state.screen==='mission'){var m=document.getElementById('mapscroll');if(m)m.scrollTop=(state.completed&&state.selected)?0:(state.completed?300:530)}}
function toast(s){var t=document.createElement('div');t.className='toast';t.textContent=s;app.querySelectorAll('.toast').forEach(function(n){n.remove()});app.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove()},2600)}
function finishStage(){if(state.feedback)return;state.mode='';state.feedback='Здорово! У тебя получилось!';save();render()}
function nextStage(){state.feedback='';state.heard='';state.mode='';state.attempts=0;state.hintUsed=false;if(state.stage<2){state.stage++;setScreen('lesson')}else{if(!state.completed){state.completed=true;state.stars+=15}setScreen('results')}}
function demoAdvance(){state.mode='demo';state.heard='Демонстрационный ответ';finishStage()}
function errorAnswer(){state.attempts++;state.heard='';state.mode='';render();toast(state.attempts>1?'Можно воспользоваться подсказкой 💡':'Попробуй ещё раз! Ты справишься 🌟')}
function startMic(){var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){toast('Распознавание недоступно. Используй деморежим ниже.');return}
try{if(recognition)recognition.abort();recognition=new Recognition();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=3;var target=state.stage===2?state.fruit:'apple';state.mode='listening';state.heard='';render();recognition.onresult=function(e){var variants=Array.from(e.results[0]).map(function(x){return x.transcript.toLowerCase()});var best=variants[0]||'';state.heard=best;var match=variants.some(function(s){return s.includes(target)&&(/would like|i like|like a|like an|i'd like|want/.test(s))});state.mode='';if(match){finishStage()}else{errorAnswer()}};recognition.onerror=function(e){state.mode='';render();toast(e.error==='not-allowed'?'Разреши доступ к микрофону или выбери деморежим':'Не удалось распознать речь. Попробуй ещё раз')};recognition.onend=function(){if(state.mode==='listening'){state.mode='';render()}};recognition.start()}catch(e){state.mode='';render();toast('Микрофон недоступен. Используй деморежим.')}}
app.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b||b.disabled)return;var a=b.getAttribute('data-action');
if(a==='restart'){state=Object.assign({},initial);save();setScreen('home');return}
if(a==='home'){setScreen('home');return}
if(a==='map'){if(recognition)try{recognition.abort()}catch(x){}setScreen('map');return}
if(a==='mission'){setScreen('mission');return}
if(a==='closemission'){setScreen('map');return}
if(a==='start'){state.stage=0;state.hintUsed=false;state.hintEver=false;state.attempts=0;state.heard='';setScreen('intro');return}
if(a==='lesson'){state.stage=0;setScreen('lesson');return}
if(a==='backshop'){if(state.screen==='intro'){setScreen('map')}else if(state.stage===0){setScreen('intro')}else{state.stage--;setScreen('lesson')}return}
if(a==='pause'){state.pause=true;render();return}
if(a==='resume'){state.pause=false;render();return}
if(a==='mic'){startMic();return}
if(a==='demo'){demoAdvance();return}
if(a==='feedbacknext'){nextStage();return}
if(a==='repeat'){say(state.stage===0?'I would like an apple, please.':state.stage===1?'What would you like?':'Sorry, we have no apples today!');return}
if(a==='welcome'){say('Welcome to my magic shop!');return}
if(a==='hint'){state.hintUsed=true;state.hintEver=true;toast(state.stage===0?'Скажи: I would like an apple, please.':state.stage===1?'Начни так: I would like an…':'Начни так: I would like a '+state.fruit+', please.');save();return}
if(a==='fruit-banana'||a==='fruit-orange'){if(state.stage===1){toast('Сейчас попроси яблоко 🍎');return}state.fruit=a.slice(6);state.heard='';render();return}
if(a==='apple'){if(state.stage===1)toast('Отличный выбор! Теперь попроси его 🎤');return}
if(a==='results'){setScreen('results');return}
if(a==='choice'){state.pending=state.selected;setScreen('choose');return}
if(a.startsWith('pick-')){state.pending=a.slice(5);save();render();return}
if(a==='confirm'){if(!state.pending){toast('Сначала выбери приключение');return}state.selected=state.pending;setScreen('map');return}
if(a==='next'){toast('Этот маршрут открыт! Следующая миссия появится в следующей версии.');return}
if(a.startsWith('branch-')){var k=a.slice(7);if(!state.completed){toast('Сначала пройди Волшебный магазин');return}if(state.selected===k)toast('Ты выбрал: '+branches[k].title);else setScreen('choose');return}
if(a==='done'){toast('Эта миссия уже пройдена ✓');return}
if(a==='locked'){toast('Эта зона пока закрыта 🔒');return}
if(a==='prizes'){toast('Твои награды: '+state.stars+' звёзд'+(state.completed?' и магическая лампа 🪔':'')+'!');return}
if(a==='profile'){toast('Герой Алекс · уровень Pre-A1/A1');return}
});
var touchStartX=null;app.addEventListener('touchstart',function(e){if(state.screen==='map'&&e.touches[0])touchStartX=e.touches[0].clientX},{passive:true});
window.NovakidDemo={reset:function(){state=Object.assign({},initial);save();render()},getState:function(){return Object.assign({},state)}};
render();
})();
</script>
</body></html>
