function questCard(m){const done=s.done.includes(m.id);return `<button class="horizontal" data-a="mission" data-id="${m.id}"><div class="thumb" style="background:${m.bg}">${m.emoji}</div><div class="copy"><span class="pill ${done?'':'mutedpill'}" style="font-size:9px;padding:3px 6px">${done?'✓ ПРОЙДЕНО':m.sector.toUpperCase()}</span><b>${m.name}</b><small>${m.time} мин · +${m.xp} XP · +${m.coin} ✦</small></div><span class="rightarr">›</span></button>`}
function home(){let m=missions.find(x=>!s.done.includes(x.id))||missions[0];return `<div class="eyebrow">МОЙ ПРОФЕССИОНАЛЬНЫЙ ПУТЬ</div><h1>Привет, Алекс 👋<br>Пробуй новое.</h1><div class="hero">${ill}<div class="hero-text"><div class="hero-cap">СЕЗОН · ТРАНСПОРТ</div><h2>Город ждёт<br>твоих решений</h2><p>Погрузись в реальные задачи профессий.</p><button class="primary" data-a="mission" data-id="${m.id}">Начать миссию ${ic('arrow',16)}</button></div></div><div class="stats"><button class="stat" data-a="levels"><small>✧ Уровень ${lvl()}</small><strong>${lvln()}</strong><div class="progress"><span style="width:${prog()}%"></span></div><div class="fine">${f(s.xp)} / ${f(limit())} XP</div></button><button class="stat" data-a="wallet"><small>✦ ПрофБаллы</small><strong>${f(s.coins)} ✦</strong><div class="fine">Тратить на награды →</div></button></div><div class="sectionhead"><h2>Продолжи исследование</h2><button class="link" data-a="routeMode" data-id="chains">Маршрут →</button></div><button class="horizontal" data-a="routeMode" data-id="chains"><div class="thumb" style="background:#dce8fb">🚇</div><div class="copy"><b>Цепочка «Метро Москвы»</b><small>${cnt(trans)} из 3 профессий · финальная награда</small><div class="progress" style="margin-top:7px"><span style="width:${cnt(trans)/3*100}%"></span></div></div><span class="rightarr">›</span></button><div class="compactbox"><div class="smallcirc">🏙️</div><div style="flex:1"><strong>Сезон транспорта</strong><small>Новые задания и тематическая награда</small></div><button class="link" data-a="season">Открыть →</button></div><button class="compactbox" style="border:0;width:100%;text-align:left;background:#f0f1ed" data-a="team"><div class="smallcirc">👥</div><div style="flex:1"><strong>Твоя команда · 9Б</strong><small>Общая цель: ${s.team}/12 проб</small></div><span class="rightarr">›</span></button><button class="lightbtn full" style="margin-top:12px" data-a="qr">${ic('qr',17)} Вход через QR на площадке</button>`}
function route(){return `<div class="eyebrow">ВЫБИРАЙ И ИССЛЕДУЙ</div><h1>Мой маршрут</h1><div class="seg">${[['missions','Миссии'],['chains','Цепочки'],['map','Карта']].map(x=>`<button data-a="routeMode" data-id="${x[0]}" class="${s.routeMode===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>${s.routeMode==='missions'?`<div class="row"><h2>Профессиональные пробы</h2><span class="pill">${s.done.length}/${missions.length}</span></div><p>Выбирай реальную задачу. Награда начисляется после проверки ведущим.</p>${missions.map(questCard).join('')}`:s.routeMode==='chains'?chains():mapView()}`}
function chains(){return `<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">КАРЬЕРНАЯ ЦЕПОЧКА</div><h2 style="margin-top:5px">Профессии метро</h2></div><span style="font-size:28px">🚇</span></div><p>Три связанные профессии, три разных типа рабочих задач.</p><div class="row" style="margin:12px 0 6px"><strong style="font-size:12px">${cnt(trans)} из 3 этапов</strong><span class="pill">Награда: 160 ✦</span></div><div class="progress"><span style="width:${cnt(trans)/3*100}%"></span></div></div><div class="timeline">${trans.map((id,i)=>{let m=missions.find(x=>x.id===id),d=s.done.includes(id);return `<div class="tlrow"><div class="tldot ${d?'ok':''}">${d?ic('check',14):i+1}</div><button class="tlbody" data-a="mission" data-id="${id}"><b>${m.name}</b><small>${d?'Выполнено · опыт в паспорте':m.title+' · доступно для прохождения'} →</small></button></div>`}).join('')}</div><button class="${cnt(trans)===3?'primary':'lightbtn'} full" data-a="chainClaim" ${s.chainClaimed?'disabled':''}>${s.chainClaimed?'✓ Награда за цепочку получена':cnt(trans)===3?'Забрать награду за цепочку':'Пройди три профессии для награды'} ${cnt(trans)===3&&!s.chainClaimed?ic('arrow',16):''}</button><div class="notice">Все основные профессиональные пробы доступны без покупки и без ограничений по уровню.</div>`}
function mapView(){const sectors=[['Транспорт','🚇'],['Сервис','🏨'],['Производство','🦾']];let arr=missions.filter(x=>x.sector===s.sector);return `<div class="mapcard"><div class="eyebrow" style="color:#c0ddc5">КАРТА ПРОФЕССИЙ</div><h2 style="color:white;margin-top:6px">Исследуй отрасли города</h2><p style="color:#b6d2cc">Выбери направление — покажем доступные профессиональные пробы.</p><div class="mapnodes">${sectors.map(([n,e])=>`<button class="node ${s.sector===n?'sel':''}" data-a="sector" data-id="${n}"><span class="em">${e}</span><small>${n}</small></button>`).join('')}</div></div><div class="row"><h2>${s.sector}</h2><span class="pill">${arr.filter(x=>s.done.includes(x.id)).length}/${arr.length}</span></div>${arr.map(questCard).join('')}<div class="notice">Карта отражает исследованный опыт, а не оценку профессиональной пригодности.</div>`}
function mission(){const m=missions.find(x=>x.id===s.mission),done=s.done.includes(m.id),started=s.started.includes(m.id);return `<button class="back" data-a="nav" data-id="route">${ic('back',15)} Мой маршрут</button><div class="questArt" style="background:${m.bg}"><div class="illustration">${m.emoji}</div></div><span class="eyebrow">${m.sector.toUpperCase()} · ${m.time} МИНУТ</span><h1 style="margin:7px 0 9px">${m.name}</h1><p>${m.desc}</p><div class="row" style="justify-content:flex-start;margin:15px 0;flex-wrap:wrap"><span class="pill">✧ +${m.xp} XP</span><span class="pill">✦ +${m.coin} баллов</span></div><div class="sectionhead"><h2>Что нужно сделать</h2></div><div class="steps">${m.steps.map((x,i)=>`<div class="step"><span class="stepn">${i+1}</span><span>${x}</span></div>`).join('')}</div><div class="notice">📍 Это офлайн-проба. Само нажатие кнопки или сканирование QR не начисляет награду.</div><button style="margin-top:15px" class="primary full" data-a="${done?'passport':started?'verify':'start'}">${done?'Посмотреть в карьерном паспорте':started?'Я выполнил задание →':'Начать профессиональную пробу →'}</button>`}

function season(){const v=cnt(trans.slice(0,2)),ready=v===2;return `<button class="back" data-a="nav" data-id="home">${ic('back',15)} Главная</button><div class="hero" style="min-height:183px"><div class="hero-text"><div class="hero-cap">ТЕМАТИЧЕСКОЕ СОБЫТИЕ</div><h2>Сезон<br>транспорта</h2><p>Исследуй, кто поддерживает движение города.</p></div>${ill}</div><div class="sectionhead"><h2>Сезонные задания</h2><span class="pill">${v}/2</span></div><p>Пройди две разные задачи, чтобы получить тематическое оформление профиля.</p>${trans.slice(0,2).map(x=>questCard(missions.find(m=>m.id===x))).join('')}<div class="card"><div class="row"><span style="font-size:29px">🎨</span><div style="flex:1"><strong style="font-size:12px">Фон «Город в движении»</strong><div class="secondaryText">Цифровая награда сезона</div></div></div><div class="progress" style="margin:12px 0"><span style="width:${v/2*100}%"></span></div><button class="${ready?'primary':'lightbtn'} full" data-a="seasonClaim" ${s.seasonClaimed?'disabled':''}>${s.seasonClaimed?'✓ Награда получена':ready?'Получить сезонную награду':'Сначала пройди две миссии'}</button></div><div class="notice">Сезон не требует ежедневных входов и не наказывает за пропуски.</div>`}

function profile(){return `<div class="eyebrow">МОЙ ЦИФРОВОЙ КАБИНЕТ</div><h1>Карьерный паспорт</h1><div class="profilehero ${s.equipped.theme?'theme':''}"><div class="pinfo"><div class="avatar ${s.equipped.frame?'framed':''}">🧑🏻‍🚀</div><div><div class="level">УЧАСТНИК ПРОГРАММЫ</div><h2>Алекс</h2><div class="level">${lvln()} · уровень ${lvl()}</div></div></div><div class="row" style="font-size:10px;margin-top:17px"><b>Мой ПрофОпыт</b><span>${f(s.xp)} / ${f(limit())} XP</span></div><div class="progress"><span style="width:${prog()}%"></span></div></div><div class="quicklinks"><button data-a="collections"><span class="em">🗂️</span>Коллекции</button><button data-a="levels"><span class="em">🏅</span>Уровни</button><button data-a="styling"><span class="em">🎨</span>Мой стиль</button></div><div class="sectionhead"><h2>Что я попробовал</h2><span class="pill">${s.done.length} проб</span></div><div class="card">${s.done.length?s.done.map(id=>{const m=missions.find(x=>x.id===id);const react={yes:'🔥 Интересно',neutral:'🙂 Нормально',no:'🤔 Не моё'};return `<div class="listrow"><span class="l-em">${m.emoji}</span><div class="grow"><strong>${m.name}</strong><small>${m.title} · ${react[s.reactions[id]]||'Впечатление не указано'}</small></div><span style="color:#68a254">${ic('check',17)}</span></div>`}).join(''):`<div style="text-align:center;padding:12px"><div style="font-size:32px">🧭</div><p>Карьерный паспорт заполнится после первой профессиональной пробы.</p><button class="lightbtn full" data-a="nav" data-id="route">Выбрать профессию</button></div>`}</div><div class="sectionhead"><h2>Достижения</h2></div><div class="badgegrid"><div class="badge">🌱<small>Первый шаг</small></div>${s.done.map(id=>{const m=missions.find(x=>x.id===id);return `<div class="badge">${m.emoji}<small>${m.badge}</small></div>`}).join('')}${s.chainClaimed?'<div class="badge">🏆<small>Мастер метро</small></div>':''}${s.teamClaimed?'<div class="badge">🤝<small>Команда</small></div>':''}</div><button class="lightbtn full" style="margin-top:13px" data-a="settings">Настройки и сброс демо</button><p style="font-size:10px">Игровой опыт не заменяет реальную квалификацию или профдиагностику.</p>`}
function collections(){const rows=[{name:'Московский транспорт',emoji:'🚇',list:trans},{name:'Городские сервисы',emoji:'🏨',list:['hotel']},{name:'Производство',emoji:'🦾',list:['factory']}];return `<button class="back" data-a="nav" data-id="profile">${ic('back',15)} Карьерный паспорт</button><div class="eyebrow">МОИ ОТКРЫТИЯ</div><h1>Коллекции профессий</h1><p>Собирай не картинки, а опыт настоящих профессиональных проб.</p>${rows.map((x,i)=>{const c=cnt(x.list);return `<button class="collection" data-a="collection" data-id="${i}"><div class="collection-icon">${x.emoji}</div><div class="grow"><strong>${x.name}</strong><small>${c} из ${x.list.length} исследовано</small><div class="progress" style="margin-top:8px"><span style="width:${c/x.list.length*100}%"></span></div></div><span class="rightarr">›</span></button>`}).join('')}<div class="notice">Завершение коллекции — цель для исследования разных профессий, не оценка способностей.</div>`}
function levels(){const list=[{id:1,name:'Новичок',xp:'0 XP',gain:'Первое достижение'}, {id:2,name:'Исследователь',xp:'400 XP',gain:'Коллекции и оформление'},{id:3,name:'Практик',xp:'1 200 XP',gain:'Дополнительная экспертная миссия'},{id:4,name:'Навигатор',xp:'2 000 XP',gain:'Особая тема профиля'}];return `<button class="back" data-a="nav" data-id="profile">${ic('back',15)} Профиль</button><div class="eyebrow">КАРЬЕРНАЯ ПРОГРЕССИЯ</div><h1>Мои уровни</h1><div class="card"><div class="row"><h2>Уровень ${lvl()} · ${lvln()}</h2><span class="pill">${f(s.xp)} XP</span></div><p>До следующей ступени: ${Math.max(0,limit()-s.xp)} XP</p><div class="progress"><span style="width:${prog()}%"></span></div></div><div class="sectionhead"><h2>Путь развития</h2></div><div class="timeline">${list.map(x=>`<div class="tlrow"><div class="tldot ${x.id<=lvl()?'ok':''}">${x.id<=lvl()?ic('check',13):x.id}</div><div class="tlbody"><b>${x.id}. ${x.name}</b><small>${x.xp} · ${x.gain}</small></div></div>`).join('')}</div><div class="notice">ПрофОпыт не тратится. Более высокий уровень даёт новые возможности, но не блокирует базовое обучение.</div>${lvl()>=3?`<button class="primary full" style="margin-top:10px" data-a="season">Перейти к новым возможностям →</button>`:''}`}
function styling(){const owned=s.items.filter(id=>goods.some(g=>g.id===id&&g.kind==='style'));if(s.seasonClaimed)owned.push('season');return `<button class="back" data-a="nav" data-id="profile">${ic('back',15)} Профиль</button><div class="eyebrow">ПЕРСОНАЛИЗАЦИЯ</div><h1>Мой стиль</h1><div class="profilehero ${s.equipped.theme?'theme':''}"><div class="pinfo"><div class="avatar ${s.equipped.frame?'framed':''}">🧑🏻‍🚀</div><div><div class="level">МОЙ АВАТАР</div><h2>Алекс</h2><div class="level">Предпросмотр оформления</div></div></div></div><div class="sectionhead"><h2>Мои предметы</h2><span class="pill">${owned.length}</span></div>${owned.length?owned.map(id=>{const g=goods.find(x=>x.id===id);const isSeason=id==='season';const name=isSeason?'Фон «Город в движении»':g.name;const emoji=isSeason?'🎨':g.emoji;const equipped=isSeason?s.equipped.theme:s.equipped[id]||false;return `<div class="horizontal" style="cursor:default"><div class="thumb" style="background:#e5f0ef">${emoji}</div><div class="copy"><b>${name}</b><small>${equipped?'Применено':'Куплено или получено'}</small></div><button class="lightbtn" data-a="equip" data-id="${id}" style="min-height:35px;font-size:10px">${equipped?'Снять':'Применить'}</button></div>`}).join(''):`<div class="card"><p>Предметов ещё нет. Получи оформление за баллы или в сезоне.</p></div>`}<button class="primary full" style="margin-top:12px" data-a="nav" data-id="shop">В каталог наград →</button>`}
function overlay(){if(!s.modal)return '';let {type,id}=s.modal;let body='';if(type==='wallet')body=`<h2>Кошелёк</h2><div class="panel" style="margin:13px 0"><span class="secondaryText">Доступно ПрофБаллов</span><div style="font-size:28px;font-weight:900">${f(s.coins)} ✦</div><small style="color:#809086">Опыт: ${f(s.xp)} XP, не расходуется</small></div><h3>История операций</h3>${s.ledger.map(x=>`<div class="listrow"><div class="grow"><strong>${x.name}</strong></div><b style="color:${x.v<0?'#ae626b':'#60914b'}">${x.v>0?'+':''}${x.v} ✦</b></div>`).join('')}`;
if(type==='qr')body=`<h2>Точки входа в центре</h2><p>В реальном центре школьник сканирует QR. Здесь выбери точку вручную.</p><div class="panel" style="text-align:center;padding:18px"><div style="font-size:50px">▦</div><div style="font-size:10px;color:#667968">Пример постера · QR не действующий</div></div>${[['welcome','🏁','Регистрация','Главный экран'],['metro','🚇','Учебное метро','Открытие профессиональной пробы'],['prize','🎁','Стойка наград','Каталог поощрений']].map(([id,em,name,desc])=>`<button class="horizontal" data-a="entry" data-id="${id}"><div class="smallcirc" style="background:#eef3eb">${em}</div><div class="copy"><b>${name}</b><small>${desc}</small></div><span class="rightarr">›</span></button>`).join('')}`;
if(type==='product'){const g=goods.find(x=>x.id===id),owned=s.items.includes(id);body=`<div class="questArt" style="background:${g.bg};height:128px"><div class="illustration" style="font-size:63px">${g.emoji}</div></div><span class="eyebrow">${g.tag.toUpperCase()}</span><h2 style="font-size:20px;margin:7px 0">${g.name}</h2><p>${g.desc}</p><div class="panel row" style="margin:13px 0"><div><small>Стоимость</small><div style="font-size:20px;font-weight:900">${g.price} ✦</div></div><div><small>Баланс</small><div style="font-weight:900">${f(s.coins)} ✦</div></div></div><button class="primary full" data-a="buy" data-id="${id}" ${owned||s.coins<g.price?'disabled':''}>${owned?'✓ Уже в инвентаре':s.coins<g.price?'Недостаточно баллов':'Обменять ПрофБаллы →'}</button>${owned&&g.kind==='style'?'<button class="lightbtn full" style="margin-top:8px" data-a="styling">Открыть редактор профиля</button>':''}`;}
if(type==='receipt'){const g=goods.find(x=>x.id===id);body=`<div style="text-align:center;font-size:52px">🎁</div><h2 style="text-align:center">Награда получена</h2><p style="text-align:center">${g.name}. Баллы списались, опыт и уровень не изменились.</p>${g.kind==='merch'?'<div class="receipt">PROF-DEMO-24</div><p>Это учебный код, реальные сувениры не выдаёт.</p>':g.kind==='event'?'<div class="notice">Дополнительная встреча появилась в разделе «Мои награды». Реальной записи нет.</div>':'<div class="notice">Предмет добавлен в инвентарь — его можно применить в редакторе профиля.</div>'}<button class="primary full" data-a="${g.kind==='style'?'styling':'dismiss'}">${g.kind==='style'?'Применить в профиле →':'Готово'}</button>`;}
if(type==='collection'){let arr=[{n:'Московский транспорт',list:trans},{n:'Городские сервисы',list:['hotel']},{n:'Производство',list:['factory']}][Number(id)];body=`<h2>${arr.n}</h2><p>${cnt(arr.list)} / ${arr.list.length} профессий изучено</p>${arr.list.map(x=>{let m=missions.find(z=>z.id===x);return `<button class="horizontal" data-a="mission" data-id="${m.id}"><div class="smallcirc">${m.emoji}</div><div class="copy"><b>${m.name}</b><small>${s.done.includes(x)?'✓ Пройдено':'Ещё не исследовано'}</small></div><span class="rightarr">›</span></button>`}).join('')}`;}
if(type==='settings')body=`<h2>Настройки</h2><div class="card" style="margin:12px 0"><div class="row"><div><b>Публичный профиль</b><p style="margin:3px 0">Выключен по умолчанию</p></div><button class="lightbtn" data-a="privacy">${s.public?'Включён':'Выключен'}</button></div></div><div class="notice">Настройка публичности демонстрационная. Публикации персональных данных здесь нет.</div><button class="lightbtn full" data-a="reset" style="margin-top:12px">Сбросить все демоданные ↺</button>`;
return `<div class="modal-layer" data-a="outside"><div class="sheet"><div class="handle"></div><div class="sheet-title"><div class="eyebrow">ПРОФКАПИТАЛ · ДЕМО</div><button class="close" data-a="dismiss">×</button></div>${body}</div></div>`;}
function render(){root.querySelector('[data-balance]').textContent=f(s.coins);const pages={home,route,mission,verify,success,season,team,shop,profile,collections,levels,styling};main.innerHTML=(pages[s.page]||home)();nav.innerHTML=[['home','home','Главная'],['route','map','Маршрут'],['shop','gift','Награды'],['profile','user','Профиль']].map(([p,icon,name])=>`<button data-a="nav" data-id="${p}" class="tab ${s.tab===p?'active':''}"><span class="navicon">${ic(icon,22)}</span>${name}</button>`).join('');over.innerHTML=overlay()}
function go(page){s.page=page;s.tab=['home','season','team'].includes(page)?'home':['route','mission','verify','success'].includes(page)?'route':page==='shop'?'shop':'profile';s.modal=null;main.scrollTop=0;render()}
function notify(msg){toast.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>{toast.innerHTML=''},2600)}
function act(a,id){if(a==='nav')return go(id);if(a==='routeMode'){s.routeMode=id;return go('route')}if(a==='rewardMode'){s.rewardMode=id;return render()}if(a==='sector'){s.sector=id;return render()}if(a==='mission'){s.mission=id;return go('mission')}if(['season','team','levels','collections','styling'].includes(a))return go(a);if(a==='passport')return go('profile');if(a==='start'){if(!s.started.includes(s.mission))s.started.push(s.mission);notify('Задание начато — выполни его офлайн');return render()}if(a==='verify')return go('verify');if(a==='confirm'){if(!s.done.includes(s.mission)){const m=missions.find(x=>x.id===s.mission);s.done.push(m.id);s.xp+=m.xp;s.coins+=m.coin;s.team=Math.min(12,s.team+1);s.ledger.unshift({name:'Проба: '+m.name,v:m.coin})}return go('success')}if(a==='reaction'){s.reactions[s.mission]=id;return render()}if(a==='chainClaim'){if(cnt(trans)===3&&!s.chainClaimed){s.chainClaimed=true;s.coins+=160;s.ledger.unshift({name:'Цепочка: Метро',v:160});render();notify('Цепочка завершена! +160 ПрофБаллов')}return}if(a==='seasonClaim'){if(cnt(trans.slice(0,2))===2&&!s.seasonClaimed){s.seasonClaimed=true;render();notify('Тематическое оформление добавлено в инвентарь')}return}if(a==='teamDemo'){s.team=Math.min(12,s.team+1);render();notify('Добавлен демонстрационный вклад класса');return}if(a==='teamClaim'){if(s.team===12&&!s.teamClaimed){s.teamClaimed=true;render();notify('Открыта командная миссия (демо)')}return}if(a==='product'){s.modal={type:'product',id};return render()}if(a==='buy'){const g=goods.find(x=>x.id===id);if(g&&!s.items.includes(id)&&s.coins>=g.price){s.items.push(id);s.coins-=g.price;s.ledger.unshift({name:'Награда: '+g.name,v:-g.price});s.modal={type:'receipt',id};return render()}return}if(a==='equip'){let key=id==='season'?'theme':id;if(key==='theme'||key==='frame'){s.equipped[key]=!s.equipped[key];render();notify(s.equipped[key]?'Оформление применено':'Оформление снято')}else notify('Значок добавлен в коллекцию');return}if(a==='qr'||a==='wallet'||a==='settings'){s.modal={type:a};return render()}if(a==='collection'){s.modal={type:'collection',id};return render()}if(a==='entry'){if(id==='metro'){s.mission='metro';go('mission')}else go(id==='prize'?'shop':'home');return}if(a==='dismiss'){s.modal=null;return render()}if(a==='privacy'){s.public=!s.public;render();notify('Изменено только в деморежиме');return}if(a==='reset'){Object.assign(s,{page:'home',tab:'home',routeMode:'missions',rewardMode:'all',sector:'Транспорт',xp:760,coins:540,done:[],started:[],reactions:{},items:[],equipped:{frame:false,theme:false},ledger:[{name:'Стартовый демобаланс',v:540}],mission:'metro',modal:null,team:8,teamClaimed:false,seasonClaimed:false,chainClaimed:false,public:false});go('home');notify('Демо сброшено')}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!root.contains(b))return;const a=b.dataset.a;if(a==='outside'){if(e.target===b){s.modal=null;render()}return}act(a,b.dataset.id)});
render();
})();
</script>
</div>
</body>
</html>
