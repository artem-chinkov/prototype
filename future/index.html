if(key==='qr'){body=`<h2>Где начинается цифровой путь?</h2><p class="sectiondesc" style="margin-top:8px">В центре ученик сканирует QR-коды на физических точках. Здесь можно пройти такой путь вручную.</p><div class="qrpreview"><div class="fakeqr">${fakeQr()}</div><div><div class="strong" style="font-size:13px">ПРОФКАПИТАЛ</div><p class="muted small" style="margin:5px 0 0">Пример QR-постера для профориентационной станции</p><span class="tag" style="margin-top:10px">DEMO · НЕ ДЛЯ СКАНИРОВАНИЯ</span></div></div><button class="modal-option" data-act="entry" data-id="welcome"><span class="e">🏁</span><span><strong>Вход / стойка регистрации</strong><small>Открыть свой профиль и получить маршрут</small></span><span class="chev">→</span></button><button class="modal-option" data-act="entry" data-id="metro"><span class="e">🚇</span><span><strong>QR у станции метро</strong><small>Открыть профпробу и её инструкцию</small></span><span class="chev">→</span></button><button class="modal-option" data-act="entry" data-id="shop"><span class="e">🎁</span><span><strong>Стойка выдачи наград</strong><small>Открыть каталог и показать код погашения</small></span><span class="chev">→</span></button>`}
if(key==='wallet'){body=`<h2>Кошелёк ПрофБаллов</h2><div class="payment"><div class="muted small">Доступно для обмена</div><div class="amount">${fmt(S.coins)} ✦</div><p class="note" style="margin:2px 0 0">ПрофОпыт (${fmt(S.xp)} XP) не тратится и не уменьшается.</p></div><div class="sub-title">История операций</div>${S.ledger.filter(e=>e.delta!==undefined).map(e=>`<div class="field"><div class="strong" style="font-size:12px">${e.title}</div><div style="color:${e.delta>0?'#528542':'#a55d65'};font-weight:850;font-size:12px">${e.delta>0?'+':''}${e.delta} ✦</div></div>`).join('')}`}
if(key==='product'){const p=products.find(x=>x.id===S.modal.id);const owned=S.items.includes(p.id);const afford=S.coins>=p.price;body=`<div class="reward-img" style="border-radius:18px;height:160px;background:${p.bg}"><i style="font-size:80px">${p.emoji}</i></div><div class="tag" style="margin:16px 0 10px">${p.cat.toUpperCase()}</div><h2>${p.name}</h2><p class="sectiondesc" style="margin:10px 0 16px">${p.desc}</p><div class="payment frow"><div><div class="muted small">Стоимость</div><div class="amount" style="font-size:23px">${fmt(p.price)} ✦</div></div><div style="text-align:right"><div class="muted small">Твой баланс</div><div class="strong">${fmt(S.coins)} ✦</div></div></div><button class="primary wide" data-act="buy" data-id="${p.id}" ${owned||!afford?'disabled':''}>${owned?'Уже в коллекции':!afford?'Недостаточно баллов':'Обменять ПрофБаллы'} ${I('arrow',17)}</button>${!afford&&!owned?'<p class="note" style="text-align:center;margin-top:12px">Пройди ещё одну профпробу, чтобы заработать баллы.</p>':''}${p.cat.includes('Сувенир')?'<p class="note" style="margin-top:12px">Демонстрация. Наличие физического пункта обмена не подтверждено.</p>':''}`}
if(key==='redeem'){body=`<div style="text-align:center;font-size:53px;margin:4px 0 14px">🎁</div><h2 style="text-align:center">Награда получена!</h2><p class="sectiondesc" style="text-align:center;margin-top:10px">ПрофБаллы списаны. ПрофОпыт и уровень остались прежними.</p><div class="payment" style="text-align:center"><div class="eyebrow">ДЕМОКОД ДЛЯ ПУНКТА ВЫДАЧИ</div><div style="font-size:26px;font-weight:850;letter-spacing:3px;margin-top:8px">PROF-2408</div></div><p class="note">Этот код демонстрационный и ничего не выдаёт. В рабочей версии это должен быть одноразовый подтверждаемый код.</p><button class="primary wide" data-act="close">Понятно</button>`}
if(key==='reset'){body=`<h2>Начать демонстрацию заново?</h2><p class="sectiondesc" style="margin:10px 0 20px">Будут сброшены пройденные миссии, покупки и демобаланс.</p><button class="primary wide" data-act="resetconfirm">Сбросить прототип</button><button class="secondary wide" data-act="close" style="margin-top:8px">Отмена</button>`}
return `<div class="overlay" data-act="closeoutside"><div class="sheet"><div class="sheet-handle"></div><div class="sheethead"><div class="eyebrow">ПРОФКАПИТАЛ · ДЕМО</div><button class="close" data-act="close">${I('close',17)}</button></div>${body}</div></div>`}
function fakeQr(){const cells=[[0,0],[8,0],[0,8]];let r='<svg viewBox="0 0 29 29" aria-hidden="true">';for(let y=0;y<29;y++)for(let x=0;x<29;x++){let iseye=cells.some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);let on=false;if(iseye){const a=cells.find(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);const u=x-a[0],v=y-a[1];on=u===0||v===0||u===6||v===6||(u>=2&&u<=4&&v>=2&&v<=4)}else on=((x*y+11*x+7*y+19)%11)<5;if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}return r+'</svg>'}
function render(){document.getElementById('wval').textContent=fmt(S.coins);nav.innerHTML=navs();main.innerHTML=({home,route,mission,verify,success,shop,profile}[S.page]||home)();modalRoot.innerHTML=modal();toastRoot.innerHTML=S.toast?`<div class="toast">${S.toast}</div>`:''}
function go(page){S.page=page;S.modal=null;main.scrollTop=0;render()};function notify(t){S.toast=t;render();setTimeout(()=>{S.toast=null;toastRoot.innerHTML=''},2600)}
function handle(act,id){if(act==='tab')go(id);else if(['profile','passport'].includes(act))go('profile');else if(act==='mission'){S.mission=id;S.stage=S.completed.includes(id)?'done':'brief';go('mission')}else if(act==='start'){S.stage='perform';notify('Задание начато. Работай с ведущим на станции.')}else if(act==='verify')go('verify');else if(act==='confirm'){if(!S.completed.includes(S.mission)){const m=missions.find(x=>x.id===S.mission);S.completed.push(m.id);S.xp+=m.xp;S.coins+=m.coins;S.ledger.unshift({title:'Проба: '+m.name,delta:m.coins});}S.stage='done';go('success')}else if(['qr','wallet'].includes(act)){S.modal={type:act};render()}else if(act==='product'){S.modal={type:'product',id};render()}else if(act==='buy'){const p=products.find(x=>x.id===id);if(p&&S.coins>=p.price&&!S.items.includes(id)){S.coins-=p.price;S.items.push(id);S.ledger.unshift({title:'Награда: '+p.name,delta:-p.price});S.modal={type:'redeem'};render()}}else if(act==='entry'){if(id==='welcome')go('home');else if(id==='shop')go('shop');else{S.mission='metro';S.stage=S.completed.includes('metro')?'done':'brief';go('mission')}}else if(act==='close'){S.modal=null;render()}else if(act==='privacy'){S.public=!S.public;notify(S.public?'Публичность включена только в демо':'Профиль снова скрыт')}else if(act==='reset'){S.modal={type:'reset'};render()}else if(act==='resetconfirm'){S.xp=760;S.coins=540;S.completed=[];S.items=[];S.public=false;S.ledger=[{title:'Стартовый демобаланс',delta:540}];S.stage='brief';go('home')}}
document.getElementById('phone').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.getAttribute('data-act'),id=b.getAttribute('data-id');if(act==='closeoutside'&&e.target===b){S.modal=null;render();return}if(act==='closeoutside')return;handle(act,id)});
render();
})();
</script></body></html>
