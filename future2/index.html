function phoneMission(){const m=mget(s.termMission);return `<button class="t-back" data-act="mobileRoute">‹ Мой маршрут</button><div class="t-bubble" style="width:100%;height:120px;font-size:64px;background:#dceee8">${m.em}</div><div class="t-eyebrow" style="margin-top:16px">${m.career}</div><h1>${m.name}</h1><p style="margin:12px 0">${m.brief}</p><div class="t-flex" style="margin:12px 0">${chip(`+${m.xp} XP`)}${chip(`+${m.points} баллов`)}</div><div class="t-card"><b>На этой станции:</b><p style="margin-top:6px">${m.action}</p></div><div class="t-note" style="margin:12px 0">Взаимодействие с оборудованием проходит офлайн, под контролем мастера. Телефон не требуется.</div><button class="t-btn dark full" data-act="termStation" data-id="${m.id}">${done(m.id)?'Посмотреть результат на терминале':'Открыть терминал станции →'}</button>`}
function phoneShop(){const filter=s.rewardView;let goods=rewards.filter(g=>filter==='all'||(filter==='owned'?s.owned.includes(g.id):g.kind===filter));return `<div class="t-eyebrow">ИГРОВАЯ ЭКОНОМИКА</div><h1>Награды</h1><div class="t-card" style="background:#1b373d;color:white;border:0"><div style="font-size:11px;color:#c9dbd1">Доступно баллов</div><div style="font-size:26px;font-weight:950">${fmt(s.coins)} ✦</div></div><div class="t-section"><h2>Каталог</h2><button class="t-textbtn" data-act="wallet">История →</button></div><div style="display:flex;gap:6px;overflow:auto;margin-bottom:12px">${[['all','Все'],['edu','Образование'],['digital','Цифровые'],['material','Сувениры'],['owned','Мои']].map(([id,l])=>`<button data-act="rewardView" data-id="${id}" class="t-role ${s.rewardView===id?'sel':''}" style="flex-shrink:0;padding:8px">${l}</button>`).join('')}</div><div class="t-prodgrid">${goods.map(g=>`<button class="t-product" data-act="product" data-id="${g.id}"><div class="art">${g.em}</div><div class="meta"><b>${g.name}</b><small>${s.owned.includes(g.id)?'✓ Получено':g.price+' ✦'}</small></div></button>`).join('')}</div>${goods.length?'':'<div class="t-card">Пока пусто — заработай баллы на профпробах.</div>'}<div class="t-note" style="margin-top:12px">Награды демонстрационные. Базовые профессиональные пробы бесплатны и не требуют баллов.</div>`}
function phoneProfile(){const all=s.completed.map(id=>mget(id));return `<div class="t-eyebrow">МОЙ ЦИФРОВОЙ КАБИНЕТ</div><h1>Карьерный паспорт</h1><div class="t-profile ${s.equipped.theme?'alt':''}"><div class="t-flex"><div class="t-avatar ${s.equipped.frame?'framed':''}">🧑🏻‍🚀</div><div><div style="font-size:10px;color:#baddcf">ПРОФЕССИОНАЛЬНЫЙ ПУТЬ</div><h2 style="color:white">Алекс</h2><div style="font-size:11px;color:#d2ead9">${levelName()} · уровень ${level()}</div></div></div><div class="t-split" style="font-size:11px;margin:15px 0 8px"><b>ПрофОпыт</b><span>${fmt(s.xp)} / ${goal()} XP</span></div>${progressbar(s.xp,goal())}</div><div class="t-quick"><button data-act="collections"><span>🗂️</span>Коллекции</button><button data-act="levels"><span>🏅</span>Уровни</button><button data-act="style"><span>🎨</span>Мой стиль</button></div><div class="t-section"><h2>Что я попробовал</h2>${chip(all.length+' проб')}</div><div class="t-card">${all.length?all.map(m=>`<div class="t-smallrow"><span style="font-size:24px">${m.em}</span><div style="flex:1"><b>${m.name}</b><div class="t-mini">${s.reflection[m.id]||'Впечатление ещё не указано'}</div></div>✓</div>`).join(''):`<p>Карьерный паспорт заполнится после подтверждения первой профпробы.</p>`}</div>${s.interest?`<div class="t-note" style="margin-top:10px">Твой предварительный интерес: ${s.interest==='tech'?'техника':s.interest==='people'?'работа с людьми':'планирование'}. Это не профессиональный диагноз.</div>`:''}<button class="t-btn full" style="margin-top:12px" data-act="next">Мой следующий шаг →</button>`}
function phoneSuccess(){const m=mget(s.termMission);return `<button class="t-back" data-act="mobileRoute">‹ Мой маршрут</button><div style="text-align:center;border-radius:20px;background:#1d4644;color:white;padding:24px 14px"><div style="font-size:48px">🏅</div><div class="t-eyebrow" style="color:#b9eaa6">ПРОБА ЗАВЕРШЕНА</div><h1 style="color:white">Результат подтверждён</h1><p style="color:#b8dad1;margin:9px">${m.consequence}</p><div style="display:flex;justify-content:center;gap:10px;margin:12px">${chip('+'+m.xp+' XP')}${chip('+'+m.points+' ✦')}</div><b>Достижение «${m.badge}»</b></div><div class="t-card" style="margin-top:13px"><h2>А тебе понравилось?</h2><p style="margin:8px 0">Впечатление останется в карьерном паспорте.</p><div class="t-statgrid">${[['Интересно','🔥'],['Нормально','🙂'],['Не моё','🤔']].map(([txt,em])=>`<button class="t-formbtn ${s.reflection[m.id]===txt?'sel':''}" style="text-align:center" data-act="reflect" data-id="${txt}">${em}<div>${txt}</div></button>`).join('')}</div><button class="t-btn full" style="margin-top:12px" data-act="passport">Открыть карьерный паспорт →</button></div>`}
function phoneNext(){let suggested=s.interest==='people'?opportunities[1]:s.interest==='plan'?opportunities[2]:opportunities[0];const state=s.nextStatus;return `<button class="t-back" data-act="homeTab">‹ Главная</button><div class="t-eyebrow">СЛЕДУЮЩИЙ ДОБРОВОЛЬНЫЙ ШАГ</div><h1>Теперь выбираешь ты</h1><p style="margin-bottom:16px">Ты познакомился с профессиями. Можно выбрать, что исследовать дальше, или вернуться позже.</p>${state!=='none'&&s.opportunity?`<div class="t-card" style="background:#e9f5e6"><div class="t-eyebrow">${state==='attended'?'ПОСЕЩЕНИЕ ПОДТВЕРЖДЕНО':state==='booked'?'ЗАПИСЬ В ДЕМО ОФОРМЛЕНА':'СОХРАНЕНО В ИЗБРАННОЕ'}</div><h2 style="margin-top:7px">${opportunities.find(o=>o.id===s.opportunity)?.name}</h2><p>${state==='booked'?'Это демонстрация, реальной записи не создано.':state==='saved'?'Можешь вернуться к выбору позже.':'Карьерный шаг отражён в демо.'}</p></div>`:''}<div class="t-section"><h2>Что попробовать</h2>${chip('3 варианта')}</div><div class="t-stack">${[suggested,...opportunities.filter(o=>o!==suggested)].map(o=>`<button class="t-tile" data-act="opp" data-id="${o.id}"><span class="t-bubble">${o.em}</span><span class="tx"><b>${o.name}</b><small>${o.kind} · ${o.desc}</small></span>›</button>`).join('')}</div><div class="t-note" style="margin-top:12px">Важен реальный следующий шаг: запись и фактическое посещение — разные события.</div><button class="t-btn ghost full" style="margin-top:11px" data-act="online">Попробовать короткую онлайн-задачу →</button>`}
function phoneOpp(){let o=opportunities.find(o=>o.id===s.opportunity)||opportunities[0];return `<button class="t-back" data-act="next">‹ Следующий шаг</button><div style="text-align:center;font-size:65px;background:#dbeee6;border-radius:19px;padding:12px;margin-bottom:14px">${o.em}</div><div class="t-eyebrow">${o.kind}</div><h1>${o.name}</h1><p style="margin:12px 0 18px">${o.desc}</p><div class="t-card"><b>Что получишь?</b><p style="margin:7px 0">Более подробное знакомство с профессией и ещё один опыт для карьерного паспорта.</p></div><button class="t-btn dark full" style="margin-top:15px" data-act="book">Записаться (демо) →</button><button class="t-btn ghost full" style="margin-top:8px" data-act="saveOpp">Сохранить на потом</button><p style="font-size:10px;margin-top:12px">Демоданные без передачи организаторам и без бронирования реальных мест.</p>`}
function phoneOnline(){return `<button class="t-back" data-act="next">‹ Следующий шаг</button><div class="t-eyebrow">ОНЛАЙН · ДО 2 МИНУТ</div><h1>Ситуация: город проснулся</h1><p style="margin:12px 0">Ты отвечаешь за городской объект. Утром произошло сразу два сбоя. Как начать работу?</p><div class="t-stack">${[['chaos','Решать наугад, как получится'],['plan','Оценить риски и распределить задачи'],['wait','Ничего не делать до вечера']].map(([id,v])=>`<button class="t-formbtn ${s.onlineDone&&id==='plan'?'sel':''}" data-act="onlineAnswer" data-id="${id}">${v}</button>`).join('')}</div>${s.onlineDone?`<div class="t-alert good" style="margin-top:12px">Ты выбрал планирование и распределение ответственности. Это одна из задач многих профессий.</div>`:''}<div class="t-note" style="margin-top:13px">Короткое цифровое продолжение дополняет практику, но не заменяет её.</div>`}
function phoneLevels(){return `<button class="t-back" data-act="passport">‹ Карьерный паспорт</button><div class="t-eyebrow">МОЙ ПРОГРЕСС</div><h1>Уровни</h1><div class="t-card"><b>${levelName()}, уровень ${level()}</b><p style="margin:7px 0">${s.xp} / ${goal()} XP до следующего уровня.</p>${progressbar(s.xp,goal())}</div><div class="t-stack" style="margin-top:12px">${[['Новичок',0],['Исследователь',250],['Практик',500]].map(([t,x])=>`<div class="t-card"><div class="t-split"><b>${t}</b>${s.xp>=x?'✓':'🔒'}</div><div class="t-mini">От ${x} XP · статусы и дополнительное оформление</div></div>`).join('')}</div><div class="t-note" style="margin-top:13px">Базовое обучение не блокируется уровнями, а XP никогда не расходуется.</div>`}
function phoneCollections(){return `<button class="t-back" data-act="passport">‹ Карьерный паспорт</button><div class="t-eyebrow">ИСТОРИЯ ОТКРЫТИЙ</div><h1>Коллекции профессий</h1>${missions.map(m=>`<div class="t-card" style="margin:9px 0"><div class="t-split"><b>${m.em} ${m.career}</b>${chip(done(m.id)?'1 / 1':'0 / 1')}</div><div style="margin-top:11px">${progressbar(done(m.id)?1:0,1)}</div></div>`).join('')}<p>Исследованные направления показывают опыт знакомства, а не профессиональную пригодность.</p>`}
function phoneStyle(){const own=rewards.filter(g=>s.owned.includes(g.id)&&g.kind==='digital');return `<button class="t-back" data-act="passport">‹ Карьерный паспорт</button><div class="t-eyebrow">КАСТОМИЗАЦИЯ</div><h1>Мой стиль</h1><div class="t-profile ${s.equipped.theme?'alt':''}"><div class="t-flex"><div class="t-avatar ${s.equipped.frame?'framed':''}">🧑🏻‍🚀</div><div><h2 style="color:white">Алекс</h2><div>Уровень ${level()} · ${levelName()}</div></div></div></div><div class="t-section"><h2>Мои предметы</h2></div>${own.length?own.map(g=>`<button class="t-tile" data-act="equip" data-id="${g.id}"><span class="t-bubble">${g.em}</span><span class="tx"><b>${g.name}</b><small>${s.equipped[g.id]?'Применено':'Нажми, чтобы применить'}</small></span><span>›</span></button>`).join(''):'<div class="t-card">Пока нет предметов оформления.</div>'}<button class="t-btn full" data-act="shopTab" style="margin-top:12px">Открыть награды →</button>`}
function phone(){const pages={home:phoneHome,route:phoneRoute,shop:phoneShop,profile:phoneProfile,mission:phoneMission,success:phoneSuccess,next:phoneNext,opp:phoneOpp,online:phoneOnline,levels:phoneLevels,collections:phoneCollections,style:phoneStyle,season:phoneSeason,team:phoneTeam};let nav=[['home','⌂','Главная'],['route','▧','Маршрут'],['shop','◇','Награды'],['profile','♙','Профиль']];return `<div class="t-mobile"><div class="t-phonehead"><b>↗ ТВОЯ РОЛЬ <span style="color:#96a39b;font-size:10px">/ мой маршрут</span></b><button class="t-wallet" data-act="wallet">✦ ${fmt(s.coins)}</button></div><div class="t-mobilebody" id="tr-scroll">${(pages[s.mobilePage]||phoneHome)()}</div><div class="t-mobilefoot">${nav.map(([k,e,t])=>`<button class="${s.mobileTab===k?'on':''}" data-act="nav" data-id="${k}"><span class="ic">${e}</span>${t}</button>`).join('')}</div>${s.modal?modal():''}${s.toast?`<div class="t-toast">${s.toast}</div>`:''}</div>`}
function modal(){let x=s.modal,b='';if(x.type==='wallet')b=`<h2>Кошелёк</h2><p style="margin:8px 0">${fmt(s.coins)} ПрофБаллов, ${fmt(s.xp)} XP (не расходуются).</p>${s.ledger.length?s.ledger.map(r=>`<div class="t-smallrow"><div style="flex:1">${r.name}</div><b>${r.val>0?'+':''}${r.val} ✦</b></div>`).join(''):'<p>Операций пока нет.</p>'}`;
if(x.type==='product'){let g=rewards.find(o=>o.id===x.id);b=`<div style="text-align:center;font-size:55px">${g.em}</div><h2>${g.name}</h2><p style="margin:10px 0">${g.desc}</p><div class="t-card t-split"><b>${g.price} ✦</b><span>Баланс: ${s.coins}</span></div><button class="t-btn full" style="margin-top:13px" data-act="buy" data-id="${g.id}" ${s.owned.includes(g.id)||s.coins<g.price?'disabled':''}>${s.owned.includes(g.id)?'✓ Уже получено':s.coins<g.price?'Недостаточно баллов':'Получить за баллы →'}</button>`}
if(x.type==='purchased')b=`<div style="text-align:center;font-size:48px">🎁</div><h2>Награда получена</h2><p style="margin:10px 0">Награда добавлена в демоинвентарь. Реальная выдача не происходит.</p><button class="t-btn full" data-act="${x.id==='frame'||x.id==='theme'||x.id==='patch'?'style':'close'}">${x.id==='frame'||x.id==='theme'||x.id==='patch'?'Посмотреть в профиле':'Готово'}</button>`;
if(x.type==='intro')b=`<h2>Как работает «Твоя роль»</h2><p style="margin:10px 0">1. Пробуешь профессиональные задачи вместе с командой.<br>2. Мастер подтверждает результат.<br>3. В паспорте накапливается твой опыт.<br>4. Ты сам выбираешь следующую активность.</p><div class="t-note">На площадке собственный смартфон не обязателен.</div><button class="t-btn full" style="margin-top:12px" data-act="mode" data-id="tv">Начать с экрана у входа →</button>`;
return `<div class="t-overlay" data-act="outside"><div class="t-sheet"><div class="t-xtop"><span class="t-eyebrow">ТВОЯ РОЛЬ · ДЕМО</span><button class="t-x" data-act="close">×</button></div>${b}</div></div>`}
function render(){modes.innerHTML=[['tv','🖥️ ТВ'],['terminal','▣ Терминал'],['master','🛡️ Ведущий'],['mobile','📱 Кабинет']].map(([k,n])=>`<button class="${s.mode===k?'sel':''}" data-act="mode" data-id="${k}">${n}</button>`).join('');stage.innerHTML=s.mode==='tv'?tv():s.mode==='terminal'?term():s.mode==='master'?master():phone();save()}
function doAction(a,id){if(a==='mode')return gotoMode(id);if(a==='reset'){s=initial();save();return render()}if(a==='startVisit'){s.visit='active';s.tvPage='quest';return render()}if(a==='finishVisit'){if(ready())s.visit='done';return render()}if(a==='termList')return termpage('stationList');if(a==='termStation'){s.termMission=id;return termpage('station',id)}if(a==='role'){s.role=id;return render()}if(a==='choice'){s.selectedChoice[s.termMission]=Number(id);return render()}if(a==='goPractice'){let m=mget(s.termMission);if(s.role&&s.selectedChoice[m.id]===m.right){s.status[m.id]='practice';return render()}}if(a==='factoryMaterial'){s.factoryMaterial=id;return render()}if(a==='submitPractice'){if(s.status[s.termMission]==='practice'){s.status[s.termMission]='pending';return render()}}if(a==='masterMission'){s.termMission=id;return render()}if(a==='approve'){let m=mget(s.termMission),c=s.checks[m.id]||{};if(s.status[m.id]==='pending'&&c.done&&c.safe&&c.feedback&&!done(m.id)){s.status[m.id]='done';s.completed.push(m.id);s.xp+=m.xp;s.coins+=m.points;s.ledger.unshift({name:'Профпроба: '+m.name,val:m.points});s.mode='mobile';s.mobileTab='profile';s.mobilePage='success';return render()}}if(a==='nav')return mobilepage(id,id);if(a==='homeTab')return mobilepage('home','home');if(a==='mobileRoute')return mobilepage('route','route');if(a==='shopTab')return mobilepage('shop','shop');if(a==='mobileMission'){s.termMission=id;return mobilepage('mission','route')}if(a==='routeView'){s.routeView=id;return render()}if(a==='rewardView'){s.rewardView=id;return render()}if(a==='reflect'){s.reflection[s.termMission]=id;return render()}if(a==='passport')return mobilepage('profile','profile');if(a==='levels'||a==='collections'||a==='style')return mobilepage(a,'profile');if(a==='next'){return mobilepage('next','home')}if(a==='opp'){s.opportunity=id;return mobilepage('opp','home')}if(a==='book'){s.nextStatus='booked';return mobilepage('next','home')}if(a==='saveOpp'){s.nextStatus='saved';return mobilepage('next','home')}if(a==='online')return mobilepage('online','home');if(a==='onlineAnswer'){if(id==='plan'){s.onlineDone=true;return alertmsg('Верно: оценка ситуации и распределение ролей важны в работе команды.')}return alertmsg('Попробуй выбрать решение, снижающее риски и учитывающее команду.')}if(a==='interest'){s.interest=id;return render()}if(a==='team'||a==='season')return mobilepage(a,'home');if(a==='seasonClaim'){if(missions.slice(0,2).every(m=>done(m.id))&&!s.seasonClaimed){s.seasonClaimed=true;if(!s.owned.includes('theme'))s.owned.push('theme');return alertmsg('Тема «Город» добавлена в коллекцию!')}}if(a==='teamClaim'){if(ready()&&!s.teamClaimed){s.teamClaimed=true;return alertmsg('Командная спецмиссия открыта (демо)')}}if(a==='wallet'||a==='intro'){s.modal={type:a};return render()}if(a==='product'){s.modal={type:'product',id};return render()}if(a==='buy'){const g=rewards.find(v=>v.id===id);if(g&&!s.owned.includes(g.id)&&s.coins>=g.price){s.coins-=g.price;s.owned.push(g.id);s.ledger.unshift({name:'Награда: '+g.name,val:-g.price});s.modal={type:'purchased',id};return render()}}if(a==='equip'){if(id==='frame'||id==='theme'){s.equipped[id]=!s.equipped[id];return render()}return alertmsg('Значок хранится в коллекции.')};if(a==='close'){s.modal=null;return render()};}
root.addEventListener('change',e=>{if(e.target.matches('[data-check]')){const k=e.target.dataset.check,id=s.termMission;s.checks[id]??={};s.checks[id][k]=e.target.checked;render()}});
root.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn||!root.contains(btn))return;let a=btn.dataset.act;if(a==='outside'){if(e.target===btn){s.modal=null;render()}return}if(btn.disabled)return;doAction(a,btn.dataset.id)});
render();
})();
</script>
</div>


<style id="tvoya-onboarding-css">

#tr-demo .tour-hint button{border:1px solid #c3d9bf;background:#fff;color:#34593c;border-radius:9px;min-height:38px;font-weight:850;padding:8px 12px;font-size:11px}
#tr-demo .tour-backdrop{position:fixed;inset:0;z-index:9999;background:#0e2729df;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}

#tr-demo .tour-scroll{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
#tr-demo .tour-head{background:radial-gradient(circle at 88% 15%,#39756e,#182f36 75%);padding:22px 23px;color:#fff}
#tr-demo .tour-eyebrow{font-size:10px;font-weight:850;letter-spacing:1.1px;color:#dafa9a}
#tr-demo .tour-head h2{color:#fff;font-size:30px;line-height:1.1;margin:8px 0;letter-spacing:-.8px}
#tr-demo .tour-head p{color:#d7e7df;font-size:12px;line-height:1.5}
#tr-demo .tour-content{padding:19px 23px}
#tr-demo .tour-content h3{font-size:14px;margin:0 0 8px;color:#213e31}
#tr-demo .tour-content p{color:#61796a;font-size:12px;line-height:1.5;margin:0 0 16px}
#tr-demo .tour-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#tr-demo .tour-step{display:flex;gap:9px;align-items:flex-start;background:#fafcf8;border:1px solid #e1eae1;padding:11px;border-radius:13px}
#tr-demo .tour-step .em{font-size:24px;flex-shrink:0}
#tr-demo .tour-step b{font-size:12px;display:block;margin-bottom:4px;color:#2a4134}
#tr-demo .tour-step small{display:block;font-size:11px;color:#6a8072;line-height:1.4}
#tr-demo .tour-note{margin-top:14px;padding:12px;border-radius:12px;background:#ecf4e9;color:#5c7864;font-size:11px;line-height:1.5}
#tr-demo .tour-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:13px 23px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid #e2ebe4;background:#fff}
#tr-demo .tour-go{flex:1 1 220px;background:#d9fa80;color:#274330;border:0;border-radius:12px;min-height:46px;font-size:13px;font-weight:900;padding:11px}
#tr-demo .tour-skip{background:#edf2ea;color:#4f7055;border:0;border-radius:12px;min-height:46px;font-size:12px;font-weight:850;padding:11px 13px}
#tr-demo .tour-restart{width:100%;border:0;background:transparent;text-decoration:underline;font-size:11px;color:#687d70;padding:4px}
#tr-demo .tour-backdrop button:focus-visible{outline:3px solid #6c8dec;outline-offset:2px}
@media(max-width:560px){#tr-demo .tour-modal{border-radius:18px}#tr-demo .tour-head{padding:18px}#tr-demo .tour-head h2{font-size:27px}#tr-demo .tour-content{padding:16px 17px}#tr-demo .tour-actions{padding:12px 17px max(12px,env(safe-area-inset-bottom,0px))}#tr-demo .tour-steps{grid-template-columns:1fr}#tr-demo .tour-step{padding:9px 11px}#tr-demo .tour-hint{align-items:flex-start}#tr-demo .tour-hint button{align-self:center}}
</style>
<script id="tvoya-onboarding-js">
(()=>{
const root=document.getElementById('tr-demo');if(!root||root.dataset.tourReady)return;root.dataset.tourReady='1';
const toolbar=root.querySelector('.t-toolbar'),modes=root.querySelector('#tr-modes');
const HELP_KEY='tvoya_rol_guide_seen_v1',TIP_KEY='tvoya_rol_hints_seen_v1',STATE_KEY='tvoya_rol_demo_v3_2026';
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let isOpen=get(HELP_KEY)!=='1', tips={};try{tips=JSON.parse(get(TIP_KEY)||'{}')||{}}catch(e){}
const help=document.createElement('button');help.type='button';help.className='tour-help';help.textContent='? Инструкция';help.setAttribute('aria-label','Как пользоваться прототипом');toolbar.insertBefore(help,toolbar.querySelector('.t-reset'));
const hint=document.createElement('div');hint.className='tour-hint';hint.hidden=true;hint.setAttribute('aria-live','polite');toolbar.insertAdjacentElement('afterend',hint);
const mount=document.createElement('div');root.appendChild(mount);
const guide={tv:['🖥️','ТВ — начало квеста','Нажмите «Начать групповой квест». Когда завершите три станции, вернитесь сюда для финального экрана.'],terminal:['▣','Терминал — профессиональная проба','Выберите станцию, роль и решение; пройдите демо офлайн-задачи и передайте результат ведущему.'],master:['🛡️','Ведущий — проверка результата','Выберите станцию со статусом «Ожидает проверки», отметьте три условия и подтвердите выполнение.'],mobile:['📱','Кабинет — карьерный маршрут','Посмотрите достижения, карьерный паспорт и награды; затем выберите следующую активность.']};
const mode=()=>modes.querySelector('button.sel')?.dataset.id||'tv';
function hasProgress(){try{const s=JSON.parse(get(STATE_KEY)||'null');return !!(s&&(s.visit!=='before'||s.completed?.length||s.xp>0||s.nextStatus!=='none'))}catch(e){return false}}
function html(){
return '<div class="tour-backdrop"><div class="tour-modal" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-desc"><div class="tour-scroll"><div class="tour-head"><div class="tour-eyebrow">ПРОФЕССИИ БУДУЩЕГО · ИНТЕРАКТИВНЫЙ ПРОТОТИП</div><h2 id="tour-title">Твоя роль</h2><p>От знакомства с профессией — к осознанному выбору.</p></div><div class="tour-content"><h3>Что это?</h3><p id="tour-desc">Гибридная система профориентации: групповые квесты с реальным оборудованием, цифровой прогресс и личный карьерный кабинет. Она помогает заинтересовать школьников и мотивирует самостоятельно выбрать следующую активность.</p><h3>Как пройти демонстрацию</h3><div class="tour-steps"><div class="tour-step"><span class="em">🖥️</span><div><b>1. ТВ · Старт</b><small>Нажмите «Начать групповой квест».</small></div></div><div class="tour-step"><span class="em">▣</span><div><b>2. Терминал · Проба</b><small>Выберите станцию, роль и решение; передайте результат.</small></div></div><div class="tour-step"><span class="em">🛡️</span><div><b>3. Ведущий · Проверка</b><small>Подтвердите результат и начисление награды.</small></div></div><div class="tour-step"><span class="em">📱</span><div><b>4. Кабинет · Дальше</b><small>Изучите опыт и выберите новую активность.</small></div></div></div><div class="tour-note">Все действия демонстрационные: работа на оборудовании, награды и запись моделируются. Режимы переключаются на верхней панели. Личный смартфон для квеста не нужен.</div></div></div><div class="tour-actions"><button class="tour-go" data-tour="start">Начать демонстрацию →</button><button class="tour-skip" data-tour="skip">Пропустить</button>'+(hasProgress()?'<button class="tour-restart" data-tour="restart">↺ Начать заново — сбросить демопрогресс</button>':'')+'</div></div></div>'
}
function refresh(){mount.innerHTML=isOpen?html():'';const key=mode(),tip=guide[key],show=!isOpen&&!tips[key];hint.hidden=!show;hint.innerHTML=show?'<span class="tour-icon">'+tip[0]+'</span><div class="tour-copy"><b>'+tip[1]+'</b>'+tip[2]+'</div><button type="button" data-tour="tip" data-id="'+key+'">Понятно</button>':'';document.body.style.overflow=isOpen?'hidden':'';if(isOpen){const primary=mount.querySelector('.tour-go');if(primary&&document.activeElement!==primary)primary.focus({preventScroll:true})}}
function close(start,restart){isOpen=false;put(HELP_KEY,'1');if(restart){toolbar.querySelector('.t-reset')?.click()}if(start){modes.querySelector('[data-id="tv"]')?.click()}refresh()}
help.addEventListener('click',()=>{isOpen=true;refresh()});
root.addEventListener('click',e=>{const btn=e.target.closest('[data-tour]');if(!btn)return;const a=btn.dataset.tour;if(a==='start')close(true,false);if(a==='skip')close(false,false);if(a==='restart')close(true,true);if(a==='tip'){tips[btn.dataset.id]=true;put(TIP_KEY,JSON.stringify(tips));refresh()}});
document.addEventListener('keydown',e=>{if(!isOpen)return;if(e.key==='Escape'){e.preventDefault();close(false,false)}if(e.key==='Tab'){const buttons=[...mount.querySelectorAll('button:not([disabled])')];if(!buttons.length)return;if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[buttons.length-1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[buttons.length-1]){e.preventDefault();buttons[0].focus()}}});
new MutationObserver(()=>refresh()).observe(modes,{childList:true});
refresh();
})();
</script>

</body></html>
